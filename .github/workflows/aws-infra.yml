name: "AWS Terraform validation \u2014 local state managed on workstation"
'on':
  workflow_dispatch:
    inputs:
      lab_bypass_checks:
        description: Skip IaC security scans for this manual lab run
        type: boolean
        required: false
        default: false
  pull_request:
    branches:
    - main
    paths:
    - aws/infra/**
    - aws/scripts/scan-iac.sh
    - .github/workflows/aws-infra.yml
  push:
    branches:
    - main
    paths:
    - aws/infra/**
    - aws/scripts/scan-iac.sh
    - .github/workflows/aws-infra.yml
permissions:
  contents: read
defaults:
  run:
    working-directory: aws
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.16.1
    - name: Format and validate configuration without loading state
      run: |-
        terraform fmt -check -recursive infra
        terraform -chdir=infra init -backend=false -input=false -lockfile=readonly
        terraform -chdir=infra validate
    - name: IaC security gates
      run: bash scripts/scan-iac.sh
      timeout-minutes: 20
      if: ${{ !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.lab_bypass_checks) }}
    - uses: actions/upload-artifact@v4
      if: ${{ always() && !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.lab_bypass_checks) }}
      with:
        name: aws-infra-security
        path: aws/reports/security/
        retention-days: 14
