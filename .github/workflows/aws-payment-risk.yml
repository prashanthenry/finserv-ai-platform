name: AWS TensorFlow and PyTorch payment risk
'on':
  pull_request:
    branches: [main]
    paths: ['aws/payment-risk/**', 'aws/scripts/scan-*.sh', '.github/workflows/aws-payment-risk.yml']
  push:
    branches: [main]
    paths: ['aws/payment-risk/**', 'aws/scripts/scan-*.sh', '.github/workflows/aws-payment-risk.yml']
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: aws/payment-risk
concurrency:
  group: aws-payment-risk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-linux.txt -r requirements-dev.txt
      - name: Lint, audit, train both models, enforce holdout gates and test API
        run: bash scripts/quality.sh
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - run: helm lint deploy/chart
      - name: Require hardened-image registry credentials
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          : "${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME repository variable}"
          : "${DOCKERHUB_TOKEN:?Set a read-only DOCKERHUB_TOKEN secret for dhi.io}"
      - uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build the exact model pair produced and tested above
        run: docker build --platform linux/amd64 --target ci -t payment-risk:ci .
      - name: Strict Trivy image gate
        run: bash scripts/scan-image.sh payment-risk:ci
      - name: OWASP ZAP API DAST on isolated container
        run: bash ../scripts/scan-dast.sh payment-risk:ci
        timeout-minutes: 20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aws-payment-risk-evidence
          path: aws/payment-risk/reports/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: aws-payment-risk-models
          path: aws/payment-risk/artifacts/
          retention-days: 14
  iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkov, tfsec and Trivy on AWS infrastructure and source
        working-directory: aws
        run: bash scripts/scan-iac.sh
        timeout-minutes: 20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aws-payment-risk-iac
          path: aws/reports/security/
          retention-days: 14
  sonar:
    needs: quality
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: aws-payment-risk-evidence
          path: aws/payment-risk/reports
      - name: Require dedicated SonarQube Cloud project configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_RISK_PROJECT_KEY: ${{ vars.SONAR_RISK_PROJECT_KEY }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          : "${SONAR_TOKEN:?Set SONAR_TOKEN secret with access to both projects}"
          : "${SONAR_ORGANIZATION:?Set SONAR_ORGANIZATION}"
          : "${SONAR_RISK_PROJECT_KEY:?Set a separate SONAR_RISK_PROJECT_KEY}"
          : "${SONAR_HOST_URL:?Set SONAR_HOST_URL}"
      - uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          projectBaseDir: aws/payment-risk
          args: -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }} -Dsonar.projectKey=${{ vars.SONAR_RISK_PROJECT_KEY }}
  release:
    needs: [quality, iac, sonar]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_RISK_AWS == 'true'
    runs-on: ubuntu-latest
    environment: aws-dev
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EKS_CLUSTER: ${{ vars.EKS_CLUSTER }}
      ECR_RISK_REPOSITORY: ${{ vars.ECR_RISK_REPOSITORY }}
      IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: aws-payment-risk-models
          path: aws/payment-risk/artifacts
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: azure/setup-kubectl@v4
        with:
          version: ${{ vars.KUBECTL_VERSION }}
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build, scan and DAST the release image before pushing
        run: |
          : "${ECR_RISK_REPOSITORY:?Set ECR_RISK_REPOSITORY from Terraform output}"
          image="$ECR_RISK_REPOSITORY:$IMAGE_TAG"
          docker build --platform linux/amd64 --target ci -t "$image" .
          bash scripts/scan-image.sh "$image"
          bash ../scripts/scan-dast.sh "$image"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "${ECR_RISK_REPOSITORY%%/*}"
          docker push "$image"
      - name: Deploy and smoke-test both framework models
        run: |
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER"
          bash scripts/deploy.sh --set-string image.repository="$ECR_RISK_REPOSITORY" --set-string image.tag="$IMAGE_TAG"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aws-payment-risk-release-security
          path: aws/payment-risk/reports/security/
          retention-days: 14
