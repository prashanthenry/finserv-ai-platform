replicas: 2
image:
  repository: copilot
  tag: local
serviceAccount:
  annotations: {}
podLabels: {}
env:
  AI_PROVIDER: offline
  APP_VERSION: local
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPU: 70
networkPolicy:
  enabled: true
